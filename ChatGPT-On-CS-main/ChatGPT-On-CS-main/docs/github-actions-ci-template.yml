name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  app-checks:
    name: App checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ChatGPT-On-CS-main/ChatGPT-On-CS-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check backend asset status
        run: pnpm run check:backend

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test -- --runInBand
