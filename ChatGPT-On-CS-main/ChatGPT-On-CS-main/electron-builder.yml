appId: com.yinbo.smartcustomer
productName: 迎波智能客服
copyright: Copyright © 2026 YinBo
asar: true
asarUnpack: "**\\*.{node,dll}"
npmRebuild: false
compression: maximum
files:
  - dist
  - node_modules
  - package.json
afterSign: ".erb/scripts/notarize.js"
win:
  executableName: 迎波智能客服
  icon: assets/icon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 迎波智能客服
  uninstallDisplayName: 迎波智能客服
  deleteAppDataOnUninstall: true
  artifactName: "${productName} ${version}.${ext}"
directories:
  app: release/app
  buildResources: assets
  output: release/build
extraResources:
  - from: assets
    to: assets
  - from: scripts
    to: scripts
  - from: ../../rag-server
    to: rag-server
    filter:
      - "**/*"
      - "!.venv/**/*"
      - "!data/**/*"
      - "!config.json"
  - from: tools/python311
    to: tools/python311
  - from: tools/rapidocr-py311
    to: tools/rapidocr-py311
  - from: tools/wechat-py311
    to: tools/wechat-py311
  - from: tools/rag-py311
    to: tools/rag-py311
afterPack: "./removeLocales.js"
